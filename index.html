Tell me about your day or simply have a conversation.
            </p>


            <div class="chat-box" id="chat-box">

                <div class="message assistant-message">

                    <span id="initial-message">
                        Hello! I'm here to talk with you.
                        How is your day going?
                    </span>

                </div>

            </div>


            <div class="chat-input">

                <button
                    class="voice-button"
                    onclick="startVoiceInput()"
                    title="Speak"
                >
                    🎙️
                </button>

                <input
                    id="user-input"
                    type="text"
                    placeholder="Type something..."
                    onkeydown="handleEnter(event)"
                >

                <button
                    id="send-button"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>

            <p id="voice-status" class="voice-status"></p>

        </div>

    </section>


    <!-- WELLBEING SUMMARY -->

    <section class="card summary">

        <div class="card-icon">📋</div>

        <div class="card-content">

            <h2 id="summary-title">
                Today's wellbeing
            </h2>


            <div class="summary-item">

                <span id="summary-checkin">
                    Daily check-in
                </span>

                <strong id="checkin-status">
                    Not completed
                </strong>

            </div>


            <div class="summary-item">

                <span id="summary-medication">
                    Medication
                </span>

                <strong id="medication-status">
                    Upcoming
                </strong>

            </div>


            <div class="summary-item">

                <span id="summary-conversation">
                    Conversation
                </span>

                <strong id="conversation-status">
                    Not started
                </strong>

            </div>

        </div>

    </section>

</main>


<footer>

    <p>CareAI</p>

    <p class="footer-small" id="footer-text">
        Prototype for educational purposes.
        Not a medical diagnostic tool.
    </p>

</footer>

</div>


<script src="script.js"></script>

</body>
</html>
